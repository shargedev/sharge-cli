name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  install-smoke:
    name: install-smoke (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 20
          - os: ubuntu-latest
            node-version: 22
          - os: macos-latest
            node-version: 22
          - os: windows-latest
            node-version: 22
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Use lockfile npm version
        run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm test -- test/package-install.test.ts
      - run: npm run build
      - run: npm pack --dry-run

  publish:
    name: publish-npm
    needs:
      - install-smoke
    runs-on: ubuntu-latest
    environment: npm publish
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use trusted publishing npm version
        run: npm install --global npm@11.6.2
      - name: Verify release tag
        shell: bash
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          if [[ "v${package_version}" != "${GITHUB_REF_NAME}" ]]; then
            printf 'Release tag %s does not match package version %s.\n' "${GITHUB_REF_NAME}" "${package_version}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run contract:test
      - run: npm run skills:validate
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm pack --dry-run --json
      - name: Check whether the version is already published
        id: registry
        shell: bash
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          published_version="$(env -u NODE_AUTH_TOKEN npm view "@sharge/cli@${package_version}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
          printf 'package-version=%s\n' "${package_version}" >> "${GITHUB_OUTPUT}"
          if [[ "${published_version}" == "${package_version}" ]]; then
            printf 'already-published=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'already-published=false\n' >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish to npm with trusted publishing
        if: steps.registry.outputs.already-published != 'true'
        run: env -u NODE_AUTH_TOKEN npm publish
      - name: Verify registry version
        shell: bash
        run: |
          package_version="${{ steps.registry.outputs.package-version }}"
          for attempt in {1..12}; do
            published_version="$(env -u NODE_AUTH_TOKEN npm view "@sharge/cli@${package_version}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [[ "${published_version}" == "${package_version}" ]]; then
              exit 0
            fi
            if [[ "${attempt}" -lt 12 ]]; then
              sleep 5
            fi
          done
          printf 'npm registry did not expose @sharge/cli@%s within 60 seconds.\n' "${package_version}" >&2
          exit 1
